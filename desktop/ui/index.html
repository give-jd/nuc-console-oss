<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nuc-console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <rect class="tile" x="4" y="4" width="56" height="56" rx="12"/>
    <rect class="frame" x="13" y="15" width="38" height="29" rx="4"/>
    <rect class="screen" x="15" y="17" width="34" height="25" rx="2"/>
    <polyline class="pulse" points="17,30 24,30 27.5,23 32,38 36,27 38.5,30 47,30"/>
    <rect class="frame" x="29" y="44" width="6" height="5"/>
    <rect class="frame" x="21" y="48" width="22" height="3" rx="1.5"/>
  </svg>
  <h1>nuc-console</h1>
  <p id="status" role="status" aria-live="polite">Starting the dashboard&hellip;</p>
  <div class="spinner" aria-hidden="true"></div>
  <pre id="log"></pre>
</main>
</body>
</html>
