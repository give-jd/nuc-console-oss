name: tests

# One run per commit: a push to main, or the commits of a pull request (a branch push with a PR open no longer runs twice).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR or branch cancels the older run (frees the few macOS runners); main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: unit · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }   # the python.org one install-macos.sh installs
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.14" } # the embeddable one install-windows.ps1 installs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python src/render.py --once --demo --cols 200 --rows 50
      - run: python src/render.py --once --cols 120 --rows 40   # the real host, no collector: must not crash

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck -S warning install.sh install-macos.sh run.sh scripts/*.sh bin/nuc-console-accept bin/nuc-console-problems bin/nuc-console-update bin/nuc-console-ai bin/nuc-console-config bin/nuc-console-ask bin/nuc-console-telegram bin/nuc-console-fleet

  # The web shell in a real browser (the Chrome the runner ships): every view in every theme and density, with and without scripts, the wall page.
  # It fails on a Content-Security-Policy or Trusted Types violation, a script error or a page without its landmarks; the screenshots are kept
  # to look at. Linux only: the page and its policy are the same on every system (the browser engine is what is under test, and the runners'
  # Chrome is the same build family), and one run takes minutes of the few macOS and Windows runners for no new coverage.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: google-chrome --version
      - run: python3 tools/browser_check.py --out shots
      - name: Keep the screenshots (a week, to look at)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-shots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

  # The real installers on fresh machines: install, collect, problems, uninstall.
  install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo NUC_CONSOLE_VT=3 ./install.sh
      - run: python3 -c "import json; d = json.load(open('/run/nuc-console/net.json')); assert d['os'] == 'linux' and d['listeners'], d"
      - run: nuc-console-problems
      # the Telegram notifier is installed idle (disabled by default); its folder holds the bot token: nobody else may list it
      - run: |
          test -f /etc/systemd/system/nuc-console-notify.service
          [ "$(stat -c '%a %U' /var/lib/nuc-console-notify)" = "711 nuc-console-notify" ]   # its own user, not the web view's
          [ "$(stat -c '%a %U %G' /var/lib/nuc-console-notify/inbox)" = "2730 nuc-console-notify nuc-console-notify" ]   # the web page's requests: its group may only add files
          ! sudo -u nuc-console ls /var/lib/nuc-console-notify/inbox 2>/dev/null   # the web view's account cannot list it
          rc=0; python3 /opt/nuc-console/notify.py --enabled || rc=$?; [ "$rc" = 1 ]
          nuc-console-telegram --status --json | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['enabled'] is False, d"
          state=$(systemctl is-failed nuc-console-notify || true); echo "nuc-console-notify: $state"; [ "$state" != failed ]
      - run: nuc-console-ask --help && sudo nuc-console-ai --help   # the optional AI commands are installed (nothing is downloaded or started)
      - run: |   # the AI folder is the web view's and the console's to write (the AI page downloads the local model there), and nothing else of /var/lib is
          test "$(stat -c %U /var/lib/nuc-console/ai)" = nuc-console && sudo -u nuc-console test -w /var/lib/nuc-console/ai/models
          ! sudo -u nuc-console test -w /var/lib/nuc-console
      - run: sudo ./install.sh --uninstall
      - run: |
          for p in /var/lib/nuc-console-notify /etc/systemd/system/nuc-console-notify.service /usr/local/bin/nuc-console-telegram; do
            [ ! -e "$p" ] && [ ! -L "$p" ] || { echo "left behind by the uninstall: $p"; exit 1; }
          done
      - run: test ! -e /usr/local/sbin/nuc-console-ai && test ! -e /usr/local/bin/nuc-console-ask

  install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo NUC_CONSOLE_DISPLAY=browser ./install.sh
      - run: sudo cat /var/log/nuc-console/collector.log || true
      - run: /opt/nuc-console/bin/nuc-console-problems
      - run: /opt/nuc-console/bin/nuc-console-ask --help && /opt/nuc-console/bin/nuc-console-ai --help
      - run: test "$(stat -f %Su "/Library/Application Support/nuc-console/ai")" = _nuc-console   # the AI page downloads the local model there, as the web view's user
      - run: |
          python3 - <<'PY'
          import json
          d = json.load(open("/var/run/nuc-console/net.json"))
          assert d["os"] == "darwin" and d["listeners"] and d["firewall"]["kind"] == "darwin", d
          assert not d["errors"], d["errors"]
          b = json.load(open("/var/run/nuc-console/boot.json"))
          assert not b["errors"], b["errors"]
          PY
      - run: curl -fsS http://127.0.0.1:8787/healthz && curl -fsS "http://127.0.0.1:8787/?fit=1&zoom=150" | grep -q "A+"
      # the Telegram notifier is installed idle (disabled by default); its folder holds the bot token: nobody else may list it
      - run: |
          test -f /Library/LaunchDaemons/com.nuc-console.notify.plist
          sudo launchctl print system/com.nuc-console.notify > /dev/null
          [ "$(stat -f '%Lp %Su' /var/lib/nuc-console-notify)" = "711 _nuc-console" ]
          [ "$(sudo stat -f '%Lp %Su' /var/lib/nuc-console-notify/inbox)" = "700 _nuc-console" ]   # the web page's requests (the same account)
          rc=0; python3 /opt/nuc-console/notify.py --enabled || rc=$?; [ "$rc" = 1 ]
          /opt/nuc-console/bin/nuc-console-telegram --status --json | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['enabled'] is False, d"
      # the fleet poller: [hosts] is empty, so the account, the job and the folders are there and nothing runs; the tokens' folder is its group's only
      - run: |
          test -f /Library/LaunchDaemons/com.nuc-console.peers.plist
          [ "$(stat -f '%Lp %Su %Sg' /etc/nuc-console/peers)" = "750 root _nuc-console-peers" ]
          [ "$(sudo stat -f '%Lp %Su' /var/lib/nuc-console-peers)" = "750 _nuc-console-peers" ]
          [ "$(stat -f '%Lp %Su' /var/lib/nuc-console-peers-cache)" = "755 _nuc-console-peers" ]
          rc=0; python3 /opt/nuc-console/peers.py --needed || rc=$?; [ "$rc" = 1 ]
          if sudo launchctl print system/com.nuc-console.peers > /dev/null 2>&1; then echo "the fleet poller runs with [hosts] empty"; exit 1; fi
      # a peer in [hosts] and the installer again (what nuc-console-update does): the job is loaded and, as its own account, makes the cache folder its own
      - run: |
          sudo sh -c 'printf "\n[hosts]\nlab = http://100.64.0.9:8787\n" >> /etc/nuc-console/config.ini'
          sudo NUC_CONSOLE_DISPLAY=browser ./install.sh
          sudo launchctl print system/com.nuc-console.peers > /dev/null
          for _ in $(seq 1 120); do [ -e /var/lib/nuc-console-peers-cache/fleet.json ] || [ -e /var/lib/nuc-console-peers-cache/.owner ] && break; sleep 1; done
          if [ ! -e /var/lib/nuc-console-peers-cache/.owner ]; then
              echo "the fleet poller wrote nothing in 120 s"; sudo cat /var/log/nuc-console/peers.log || true
              ls -lde /var/lib/nuc-console-peers-cache /var/lib/nuc-console-peers-cache/* || true; sudo launchctl print system/com.nuc-console.peers || true
              exit 1
          fi
          [ "$(stat -f %Su /var/lib/nuc-console-peers-cache/.owner)" = _nuc-console-peers ]
      - run: sudo ./install.sh --uninstall
      - run: |
          for p in /var/lib/nuc-console-notify /Library/LaunchDaemons/com.nuc-console.notify.plist /Library/LaunchDaemons/com.nuc-console.peers.plist /usr/local/bin/nuc-console-telegram; do
            [ ! -e "$p" ] && [ ! -L "$p" ] || { echo "left behind by the uninstall: $p"; exit 1; }
          done
          test ! -e /opt/nuc-console/bin/nuc-console-ai
          if sudo launchctl print system/com.nuc-console.notify > /dev/null 2>&1; then echo "com.nuc-console.notify still loaded"; exit 1; fi
          if sudo launchctl print system/com.nuc-console.peers > /dev/null 2>&1; then echo "com.nuc-console.peers still loaded"; exit 1; fi
          [ -d /etc/nuc-console/peers ]   # the tokens of the peers stay, like the configuration

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: powershell
        run: powershell -ExecutionPolicy Bypass -File install-windows.ps1 -Display browser
      - shell: powershell
        run: |
          Get-Content "$env:ProgramData\nuc-console\logs\collector.log" -ErrorAction SilentlyContinue
          & "$env:ProgramFiles\nuc-console\bin\nuc-console-problems.cmd"
          foreach ($c in 'nuc-console-ask', 'nuc-console-ai') {  # the optional AI commands are installed (nothing is downloaded or started)
              & "$env:ProgramFiles\nuc-console\bin\$c.cmd" --help | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "$c.cmd --help failed" }
          }
          $acl = (& icacls.exe "$env:ProgramData\nuc-console\ai") -join "`n"   # the AI page downloads the local model there, as LOCAL SERVICE
          if ($acl -notmatch 'LOCAL SERVICE:\(OI\)\(CI\)\(M\)') { throw "LOCAL SERVICE may not write the AI folder: $acl" }
          $d = Get-Content "$env:ProgramData\nuc-console\run\net.json" -Raw | ConvertFrom-Json
          if ($d.os -ne 'windows' -or -not $d.listeners -or $d.firewall.kind -ne 'windows') { throw "unexpected net.json" }
          if (@($d.errors.PSObject.Properties).Count) { throw ("net errors: " + ($d.errors | ConvertTo-Json)) }
          if (-not (Test-Path "$env:ProgramData\nuc-console\lib\baseline.json")) { throw "no baseline" }
          $page = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8787/?fit=1&zoom=150"
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'A\+') { throw "local web view not serving the dashboard" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\nuc-console.url")) { throw "no Start menu shortcut" }
      # the Telegram notifier is registered idle (disabled by default); its folder holds the bot token: ordinary users must not be in its ACL
      - shell: powershell
        run: |
          if (-not (Get-ScheduledTask -TaskPath '\nuc-console\' -TaskName 'notify' -ErrorAction SilentlyContinue)) { throw "no notify task" }
          $notify = "$env:ProgramData\nuc-console\notify"
          if (-not (Test-Path $notify)) { throw "no notify folder" }
          $acl = (& icacls.exe "$notify\private") -join "`n"
          if ($acl -match 'BUILTIN\\Users|Everyone|Authenticated Users|LOCAL SERVICE') { throw "the notifier's private folder is open to others: $acl" }
          if ($acl -notmatch 'NETWORK SERVICE') { throw "the notifier (NETWORK SERVICE) cannot use its private folder: $acl" }
          $acl = (& icacls.exe "$notify\inbox") -join "`n"   # the web page's requests: LOCAL SERVICE may add a file and nothing else
          if ($acl -match 'BUILTIN\\Users|Everyone|Authenticated Users') { throw "the notifier's inbox is open to others: $acl" }
          if ($acl -notmatch 'LOCAL SERVICE:\(W\)') { throw "LOCAL SERVICE should only add files to the inbox: $acl" }
          if ($acl -notmatch 'NETWORK SERVICE:\(OI\)\(CI\)\(M\)') { throw "the notifier cannot read its inbox: $acl" }
          $who = (Get-ScheduledTask -TaskPath '\nuc-console\' -TaskName 'notify').Principal.UserId
          if ($who -notmatch 'NETWORK SERVICE') { throw "the notify task runs as $who, not NETWORK SERVICE" }
          & "$env:ProgramFiles\nuc-console\python\python.exe" -B "$env:ProgramFiles\nuc-console\app\notify.py" --enabled
          if ($LASTEXITCODE -ne 1) { throw "notify.py --enabled exited $LASTEXITCODE (expected 1: disabled by default)" }
          $out = (& "$env:ProgramFiles\nuc-console\bin\nuc-console-telegram.cmd" --status --json) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "nuc-console-telegram --status failed: $out" }
          if (($out | ConvertFrom-Json).enabled -ne $false) { throw "the notifier is not disabled by default: $out" }
          $global:LASTEXITCODE = 0  # the step's exit code is the last native command's: the expected 1 above must not fail it
      # the fleet poller: [hosts] is empty, so no task is made; its folders are there, and only the poller (NETWORK SERVICE), SYSTEM and Administrators are in the tokens' and the state's ACL
      - shell: powershell
        run: |
          if (Get-ScheduledTask -TaskPath '\nuc-console\' -TaskName 'peers' -ErrorAction SilentlyContinue) { throw "a peers task exists with [hosts] empty" }
          foreach ($f in 'peers', 'peers-state') {
              $acl = (& icacls.exe "$env:ProgramData\nuc-console\$f") -join "`n"
              if ($acl -match 'BUILTIN\\Users|Everyone|Authenticated Users|LOCAL SERVICE') { throw "the fleet poller's $f folder is open to others: $acl" }
              if ($acl -notmatch 'NETWORK SERVICE') { throw "the fleet poller (NETWORK SERVICE) cannot use its $f folder: $acl" }
          }
          $acl = (& icacls.exe "$env:ProgramData\nuc-console\run\peers") -join "`n"   # the cache: everybody reads, the poller writes
          if ($acl -notmatch 'NETWORK SERVICE:\(OI\)\(CI\)\(M\)' -or $acl -notmatch 'LOCAL SERVICE:\(OI\)\(CI\)\(RX\)') { throw "unexpected ACL on the fleet cache: $acl" }
          $global:LASTEXITCODE = 0
      # a peer in [hosts] and the installer again (what nuc-console-update does): the task exists, runs as NETWORK SERVICE with --log, and makes the cache folder its own
      - shell: powershell
        run: |
          Add-Content -LiteralPath "$env:ProgramData\nuc-console\config.ini" -Value "`n[hosts]`nlab = http://100.64.0.9:8787"
          powershell -ExecutionPolicy Bypass -File install-windows.ps1 -Display browser
          if ($LASTEXITCODE -ne 0) { throw "the second install failed" }
          $t = Get-ScheduledTask -TaskPath '\nuc-console\' -TaskName 'peers' -ErrorAction SilentlyContinue
          if (-not $t) { throw "no peers task with a peer in [hosts]" }
          if ($t.Principal.UserId -notmatch 'NETWORK SERVICE') { throw "the peers task runs as $($t.Principal.UserId), not NETWORK SERVICE" }
          $arg = $t.Actions[0].Arguments
          if ($arg -notmatch '^-E -B ".*peers\.py" serve --log ".*peers\.log"') { throw "unexpected command line: $arg" }
          $cache = "$env:ProgramData\nuc-console\run\peers"
          for ($i = 0; $i -lt 120; $i++) { if ((Test-Path "$cache\fleet.json") -or (Test-Path "$cache\.owner")) { break }; Start-Sleep -Seconds 1 }
          if (-not (Test-Path "$cache\.owner")) {
              Get-Content "$env:ProgramData\nuc-console\logs\peers.log" -ErrorAction SilentlyContinue
              Get-ChildItem -Force $cache -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime | Out-String
              icacls.exe $cache
              Get-ScheduledTaskInfo -TaskPath '\nuc-console\' -TaskName 'peers' | Format-List | Out-String
              throw "the fleet poller wrote nothing in its cache folder in 120 s"
          }
      - shell: powershell
        run: powershell -ExecutionPolicy Bypass -File install-windows.ps1 -Uninstall
      - shell: powershell
        run: |
          if (Test-Path "$env:ProgramData\nuc-console\notify") { throw "the notifier's folder (bot token) survived the uninstall" }
          if (Get-ScheduledTask -TaskPath '\nuc-console\' -TaskName 'notify' -ErrorAction SilentlyContinue) { throw "the notify task survived the uninstall" }
          if (Get-ScheduledTask -TaskPath '\nuc-console\' -TaskName 'peers' -ErrorAction SilentlyContinue) { throw "the peers task survived the uninstall" }
          if (-not (Test-Path "$env:ProgramData\nuc-console\peers")) { throw "the tokens of the peers must stay, like config.ini" }
          if (Test-Path "$env:ProgramFiles\nuc-console\bin\nuc-console-ai.cmd") { throw "nuc-console-ai.cmd is still there" }
