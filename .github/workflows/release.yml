name: release

# Push a tag vX.Y.Z (X.Y.Z = VERSION in src/nuc_config.py) and this builds the six archives (Linux and macOS for x86-64 and ARM,
# Windows for x64 and ARM64) with tools/build_release.py and the desktop app's packages around them (desktop.yml), attests each one
# (SLSA build provenance, signed with this workflow's identity) and creates the GitHub release with the archives, SHA256SUMS, the
# packages and SHA256SUMS-desktop. Every archive carries the Python it runs with:
# the Windows ones the official embeddable Python (pinned in install-windows.ps1), the Linux and macOS ones a python-build-standalone
# CPython (pinned in tools/python-pins.json, filled by the python-pins job of ai-pins.yml): this workflow downloads the six files,
# checks each against its pin, and the build checks them again. While a pin is null the workflow stops: no archive without a Python.
#
# Dry run: Actions > release > Run workflow, choose the branch or tag to build and type the tag it is for (v1.4.0). The same
# checks and the same archives, uploaded as a workflow artifact: no provenance is signed and no release is created.
#
# Five jobs, so that nothing but the publishing step can write: "build" (tests, downloads, archives) can only read the repository
# and has no OIDC token; "smoke-unix" and "smoke-windows" take the six archives that "build" made, each on a runner of its own
# system and processor with NO setup-python and no checkout (the archive alone: the Python it carries is the only one it may use),
# check it against SHA256SUMS, unpack it and run it (run.sh / run.cmd --which-python, --problems, a --once --demo render); they can
# only read; "desktop" (desktop.yml) builds the desktop app's packages around those same archives, installs each on a runner of its
# own and starts it (--smoke-test), and can only read too; "release" runs no code of this repository, it needs all of them (a broken
# archive or package is never published), only signs what "build" and "desktop" made (the archives checked against SHA256SUMS
# again, the packages listed in SHA256SUMS-desktop) and publishes them, and is the only one with contents: write, id-token: write,
# attestations: write. A dry run runs the smoke jobs and the desktop packages too.
# Actions are pinned by commit SHA (the comment says which release it is); the only secret is the built-in GITHUB_TOKEN.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag this build is for (vX.Y.Z); it must be VERSION in src/nuc_config.py. Nothing is released."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The tag is the version of the code
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: '$TAG' is not a tag vX.Y.Z" >&2
            exit 1
          fi
          version="$(python3 -c 'import sys; sys.path.insert(0, "src"); import nuc_config; print(nuc_config.VERSION)')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "error: the tag is $TAG but VERSION in src/nuc_config.py is $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # the interpreter that makes the archives: zlib decides the bytes of the compressed streams
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Download the Pythons (four python-build-standalone tarballs, two Windows embeddable zips) and check their SHA-256
        shell: bash
        run: |
          set -euo pipefail
          # file, SHA-256 and URL of each one: the Linux and macOS ones from tools/python-pins.json, the Windows ones from $PyVersion /
          # $PyBuilds of install-windows.ps1, the pins the installer checks. This stops here while a pin is null (never pinned).
          python3 tools/build_release.py --list-python > python-files.txt
          [ "$(wc -l < python-files.txt)" -eq 6 ]
          mkdir pythons
          while read -r file sha256 url; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
              --output "pythons/$file" "$url"
            echo "$sha256  pythons/$file" | sha256sum --check -
          done < python-files.txt
          [ "$(ls pythons | wc -l)" -eq 6 ]

      - name: Build the archives
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_release.py --version "$VERSION" --out dist --python-dir pythons
          # the same input must give the same bytes: build again and compare
          python3 tools/build_release.py --version "$VERSION" --out dist-again --python-dir pythons > /dev/null
          diff <(ls dist) <(ls dist-again)
          for f in dist/*; do cmp "$f" "dist-again/$(basename "$f")"; done
          rm -r dist-again
          for os in linux-x86_64.tar.gz linux-arm64.tar.gz macos-arm64.tar.gz macos-x86_64.tar.gz windows-x64.zip windows-arm64.zip; do
            test -s "dist/nuc-console-$VERSION-$os"
          done
          test "$(find dist -type f | wc -l)" -eq 7   # the six archives and SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          ls -l dist
          tar tzf "dist/nuc-console-$VERSION-linux-x86_64.tar.gz" > linux-x86_64.list
          head -40 linux-x86_64.list
          unzip -l "dist/nuc-console-$VERSION-windows-x64.zip"

      - name: The Linux x86-64 archive runs on its own Python, unpacked somewhere else
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          tar xzf "dist/nuc-console-$VERSION-linux-x86_64.tar.gz" -C "$d"
          cd "$d/nuc-console-$VERSION"
          test "$(./run.sh --which-python)" = "$PWD/python/bin/python3"   # the Python of the archive, not the runner's
          ./python/bin/python3 -c 'import sys, ssl, sqlite3, json, ctypes, http.server; print(sys.version); print(sys.prefix)'
          timeout 120 ./run.sh --problems > /dev/null

      - name: Keep the archives for the release job (a dry run keeps them for a week, to look at)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Linux and macOS: every archive, on a runner of its own processor. No setup-python and no checkout on purpose: what runs is what
  # a user gets, an archive and whatever the machine has (the runners do have a Python: run.sh must still pick the one in python/).
  smoke-unix:
    name: smoke · ${{ matrix.archive }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archive: linux-x86_64, runner: ubuntu-latest }
          - { archive: linux-arm64, runner: ubuntu-24.04-arm }   # free for public repositories
          - { archive: macos-arm64, runner: macos-latest }        # Apple silicon
          # The last Intel image GitHub hosts (macos-13 is gone), announced until August 2027. When it goes there is no hosted Intel Mac:
          # remove this entry, and say in CONTRIBUTING.md that macos-x86_64 is not run in CI (tests/test_release.py names the entry).
          - { archive: macos-x86_64, runner: macos-15-intel }
    env:
      ARCHIVE: ${{ matrix.archive }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: It is the archive that SHA256SUMS lists (the release job publishes that file), for this runner's processor, unpacked
        shell: bash
        run: |
          set -euo pipefail
          case "$ARCHIVE:$(uname -m)" in
            linux-x86_64:x86_64 | linux-arm64:aarch64 | macos-arm64:arm64 | macos-x86_64:x86_64) ;;
            *) echo "error: the archive $ARCHIVE is not for this runner ($(uname -s) $(uname -m))" >&2; exit 1 ;;
          esac
          cd dist
          set -- nuc-console-*-"$ARCHIVE".tar.gz
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then echo "error: expected one nuc-console-*-$ARCHIVE.tar.gz in dist" >&2; exit 1; fi
          file=$1
          version=${file#nuc-console-}
          version=${version%-"$ARCHIVE".tar.gz}
          if [ "$version" != "${TAG#v}" ]; then echo "error: $file is not the archive of $TAG" >&2; exit 1; fi
          grep -F -- "  $file" SHA256SUMS > "$RUNNER_TEMP/smoke-sum.txt" || { echo "error: $file is not in SHA256SUMS" >&2; exit 1; }
          if command -v sha256sum > /dev/null 2>&1; then sha256sum --check "$RUNNER_TEMP/smoke-sum.txt"; else shasum -a 256 --check "$RUNNER_TEMP/smoke-sum.txt"; fi
          rm -rf "$RUNNER_TEMP/smoke"
          mkdir "$RUNNER_TEMP/smoke"
          tar xzf "$file" -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke/nuc-console-$version"
          echo "SMOKE=$(pwd -P)" >> "$GITHUB_ENV"
          ls -l

      - name: run.sh --which-python names the Python of the archive, and that Python runs from the archive
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHON PYTHONHOME PYTHONPATH   # nothing may steer run.sh away from python/
          cd "$SMOKE"
          py="$(./run.sh --which-python)"
          echo "$py"
          if [ "$py" != "$SMOKE/python/bin/python3" ]; then
            echo "error: run.sh would run $py, not the Python of the archive ($SMOKE/python/bin/python3)" >&2
            exit 1
          fi
          "$py" -I -c '
          import os, sys, ssl, sqlite3, json, ctypes, http.server, zlib, hashlib
          root, prefix = os.path.realpath(sys.argv[1]), os.path.realpath(sys.prefix)
          print(sys.version)
          print("prefix", prefix)
          print("openssl", ssl.OPENSSL_VERSION, "sqlite", sqlite3.sqlite_version)
          assert sys.version_info >= (3, 8), sys.version_info
          assert prefix == root, "this Python runs from %s, not from the archive (%s)" % (prefix, root)
          ' "$SMOKE/python"

      - name: run.sh --problems exits 0 and reports (no collector runs here, so it lists that), as text and as JSON
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHON PYTHONHOME PYTHONPATH
          cd "$SMOKE"
          ./run.sh --problems | tee "$RUNNER_TEMP/problems.txt"
          grep -Eq '^(no problems|[0-9]+ problems)' "$RUNNER_TEMP/problems.txt"
          ./run.sh --problems --json | ./python/bin/python3 -I -c 'import json, sys; json.load(sys.stdin)'
          test -f data/config.ini   # what it writes is in the folder of the archive

      - name: A --once --demo render with the Python of the archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$SMOKE"
          NUC_CONSOLE_HOME="$SMOKE/data" ./python/bin/python3 -B src/render.py --once --demo --cols 120 --rows 33 > "$RUNNER_TEMP/demo.txt"
          cat "$RUNNER_TEMP/demo.txt"
          grep -q 'demo-host' "$RUNNER_TEMP/demo.txt"
          grep -q 'ATTENTION' "$RUNNER_TEMP/demo.txt"
          test "$(grep -c '' "$RUNNER_TEMP/demo.txt")" -ge 20

  # Windows: the same, with run.cmd. The embeddable Python is unpacked by the first run (and reused by the next).
  smoke-windows:
    name: smoke · ${{ matrix.archive }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archive: windows-x64, runner: windows-latest }
          - { archive: windows-arm64, runner: windows-11-arm }   # free for public repositories
    env:
      ARCHIVE: ${{ matrix.archive }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: It is the archive that SHA256SUMS lists (the release job publishes that file), for this runner's processor, unpacked
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = if ($env:PROCESSOR_ARCHITEW6432) { $env:PROCESSOR_ARCHITEW6432 } else { $env:PROCESSOR_ARCHITECTURE }   # as run.ps1 reads it
          $expected = @{ 'windows-x64' = 'AMD64'; 'windows-arm64' = 'ARM64' }[$env:ARCHIVE]
          if ($arch -ne $expected) { throw "the archive $($env:ARCHIVE) is not for this runner ($arch)" }
          $suffix = "-$($env:ARCHIVE).zip"
          $files = @(Get-ChildItem -LiteralPath dist -Filter "nuc-console-*$suffix")
          if ($files.Count -ne 1) { throw "expected one nuc-console-*$suffix in dist, found $($files.Count)" }
          $file = $files[0]
          $version = $file.Name.Substring('nuc-console-'.Length)
          $version = $version.Substring(0, $version.Length - $suffix.Length)
          if ($version -ne ($env:TAG -replace '^v', '')) { throw "$($file.Name) is not the archive of $($env:TAG)" }
          $lines = @(Get-Content -LiteralPath 'dist\SHA256SUMS' | Where-Object { $_.EndsWith("  $($file.Name)") })
          if ($lines.Count -ne 1) { throw "$($file.Name) is not listed once in SHA256SUMS" }
          $want = $lines[0].Split(' ')[0]
          $have = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLower()
          if ($have -ne $want) { throw "$($file.Name) has SHA-256 $have, SHA256SUMS says $want" }
          Write-Host "$($file.Name): SHA-256 $have, as in SHA256SUMS"
          # Under Program Files: the runner is an administrator, and run.ps1 refuses, as one, a folder that ordinary users can write to
          # (a folder of the runner's work drive may be one); Program Files is where its message sends you.
          $dest = Join-Path $env:ProgramFiles 'nuc-console-smoke'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -LiteralPath $file.FullName -DestinationPath $dest
          $smoke = Join-Path $dest "nuc-console-$version"
          if (-not (Test-Path -LiteralPath (Join-Path $smoke 'run.cmd'))) { throw "run.cmd is not in $smoke" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SMOKE=$smoke" -Encoding Ascii
          Get-ChildItem -LiteralPath $smoke | ForEach-Object { Write-Host $_.Name }

      - name: run.cmd -WhichPython names the Python of the archive (unpacked once, then reused), and that Python runs from the archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'   # a native command's stderr must not stop the script: its exit code is checked
          Set-Location -LiteralPath $env:SMOKE
          $want = Join-Path $env:SMOKE 'python\python.exe'
          $out = @(cmd /c ".\run.cmd -WhichPython < NUL")   # the first run unpacks the zip and says so before it prints the path
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) { throw "run.cmd -WhichPython exited $rc" }
          $last = $out | Where-Object { "$_".Trim() } | Select-Object -Last 1
          $python = "$last".Trim()
          if ($python -ne $want) { throw "run.cmd would run '$python', not the Python of the archive ($want)" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:SMOKE 'python\nuc-console-python.txt'))) { throw "the Python was not unpacked (no stamp file)" }
          $again = @(cmd /c ".\run.cmd -WhichPython < NUL")   # the second run reuses it: the path and nothing else
          if ($LASTEXITCODE -ne 0 -or $again.Count -ne 1 -or "$($again[0])".Trim() -ne $want) { throw "the second run said: $($again -join ' / ')" }
          $check = Join-Path $env:RUNNER_TEMP 'check.py'
          Set-Content -LiteralPath $check -Encoding Ascii -Value @'
          import os, sys, ssl, sqlite3, json, ctypes, http.server, zlib, hashlib
          root, prefix = os.path.realpath(sys.argv[1]), os.path.realpath(sys.prefix)
          print(sys.version)
          print("prefix", prefix)
          print("openssl", ssl.OPENSSL_VERSION, "sqlite", sqlite3.sqlite_version)
          assert sys.version_info >= (3, 8), sys.version_info
          assert os.path.normcase(prefix) == os.path.normcase(root), "this Python runs from %s, not from the archive (%s)" % (prefix, root)
          '@
          & $python -I $check (Join-Path $env:SMOKE 'python')
          if ($LASTEXITCODE -ne 0) { throw "the Python of the archive does not run from the archive (exit $LASTEXITCODE)" }

      - name: run.cmd -Problems exits 0 and reports (no collector runs here, so it lists that)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location -LiteralPath $env:SMOKE
          $out = @(cmd /c ".\run.cmd -Problems < NUL")
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) { throw "run.cmd -Problems exited $rc" }
          if ("$($out | Select-Object -First 1)" -notmatch '^(no problems|\d+ problems)') { throw "run.cmd -Problems did not report" }
          if (-not (Test-Path -LiteralPath 'data\config.ini')) { throw "nothing was written to the data folder of the archive" }

      - name: A --once --demo render with the Python of the archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location -LiteralPath $env:SMOKE
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { }
          $env:NUC_CONSOLE_HOME = Join-Path $env:SMOKE 'data'
          $out = @(& (Join-Path $env:SMOKE 'python\python.exe') -B 'src\render.py' --once --demo --cols 120 --rows 33)
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) { throw "render.py --once --demo exited $rc" }
          $text = $out -join "`n"
          if ($text -notmatch 'demo-host' -or $text -notmatch 'ATTENTION' -or $out.Count -lt 20) { throw "the demo screen is not the one expected" }

  # The desktop app: its packages (.deb, .rpm, AppImage, .dmg, .msi, setup .exe), built around the archives above (input dist), each
  # installed and started on a runner of its own system and processor. desktop.yml says how; it can only read.
  desktop:
    needs: build
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read
    with:
      dist: dist

  release:
    needs: [build, smoke-unix, smoke-windows, desktop]   # a broken archive or package is never published
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write       # create the release and attach the archives
      id-token: write       # sign the provenance with this workflow's OIDC identity
      attestations: write   # and store it with the repository
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-package-*
          path: desktop
          merge-multiple: true

      - name: What was built is what is published
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          test "$(find . -type f | wc -l)" -eq 7   # the six archives and SHA256SUMS
          for os in linux-x86_64.tar.gz linux-arm64.tar.gz macos-arm64.tar.gz macos-x86_64.tar.gz windows-x64.zip windows-arm64.zip; do
            test -s "nuc-console-${TAG#v}-$os"
          done
          cd ../desktop
          # the ten packages of the desktop app, named after the archives they carry
          for p in linux-x86_64.deb linux-x86_64.rpm linux-x86_64.AppImage linux-arm64.deb linux-arm64.rpm macos-arm64.dmg macos-x86_64.dmg \
                   windows-x64.msi windows-x64-setup.exe windows-arm64-setup.exe; do
            test -s "nuc-console-desktop-${TAG#v}-$p"
          done
          test "$(find . -type f | wc -l)" -eq 10
          sha256sum nuc-console-desktop-* > SHA256SUMS-desktop
          cat SHA256SUMS-desktop

      - name: Provenance of every archive and package
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            desktop/nuc-console-desktop-*
            desktop/SHA256SUMS-desktop

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* desktop/* --verify-tag --title "nuc-console ${TAG#v}" --generate-notes
