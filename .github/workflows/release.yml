name: release

# Push a tag vX.Y.Z (X.Y.Z = VERSION in src/nuc_config.py) and this builds the six archives (Linux and macOS for x86-64 and ARM,
# Windows for x64 and ARM64) with tools/build_release.py, attests each one (SLSA build provenance, signed with this workflow's
# identity) and creates the GitHub release with the archives and SHA256SUMS. Every archive carries the Python it runs with:
# the Windows ones the official embeddable Python (pinned in install-windows.ps1), the Linux and macOS ones a python-build-standalone
# CPython (pinned in tools/python-pins.json, filled by the python-pins job of ai-pins.yml): this workflow downloads the six files,
# checks each against its pin, and the build checks them again. While a pin is null the workflow stops: no archive without a Python.
#
# Dry run: Actions > release > Run workflow, choose the branch or tag to build and type the tag it is for (v1.4.0). The same
# checks and the same archives, uploaded as a workflow artifact: no provenance is signed and no release is created.
#
# Two jobs, so that nothing but the publishing step can write: "build" (tests, downloads, archives) can only read the repository
# and has no OIDC token; "release" runs no code of this repository, it only signs the archives that "build" made (checked
# against SHA256SUMS again) and publishes them, and is the only one with contents: write, id-token: write, attestations: write.
# Actions are pinned by commit SHA (the comment says which release it is); the only secret is the built-in GITHUB_TOKEN.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag this build is for (vX.Y.Z); it must be VERSION in src/nuc_config.py. Nothing is released."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The tag is the version of the code
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: '$TAG' is not a tag vX.Y.Z" >&2
            exit 1
          fi
          version="$(python3 -c 'import sys; sys.path.insert(0, "src"); import nuc_config; print(nuc_config.VERSION)')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "error: the tag is $TAG but VERSION in src/nuc_config.py is $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # the interpreter that makes the archives: zlib decides the bytes of the compressed streams
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Download the Pythons (four python-build-standalone tarballs, two Windows embeddable zips) and check their SHA-256
        shell: bash
        run: |
          set -euo pipefail
          # file, SHA-256 and URL of each one: the Linux and macOS ones from tools/python-pins.json, the Windows ones from $PyVersion /
          # $PyBuilds of install-windows.ps1, the pins the installer checks. This stops here while a pin is null (never pinned).
          python3 tools/build_release.py --list-python > python-files.txt
          [ "$(wc -l < python-files.txt)" -eq 6 ]
          mkdir pythons
          while read -r file sha256 url; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
              --output "pythons/$file" "$url"
            echo "$sha256  pythons/$file" | sha256sum --check -
          done < python-files.txt
          [ "$(ls pythons | wc -l)" -eq 6 ]

      - name: Build the archives
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_release.py --version "$VERSION" --out dist --python-dir pythons
          # the same input must give the same bytes: build again and compare
          python3 tools/build_release.py --version "$VERSION" --out dist-again --python-dir pythons > /dev/null
          diff <(ls dist) <(ls dist-again)
          for f in dist/*; do cmp "$f" "dist-again/$(basename "$f")"; done
          rm -r dist-again
          for os in linux-x86_64.tar.gz linux-arm64.tar.gz macos-arm64.tar.gz macos-x86_64.tar.gz windows-x64.zip windows-arm64.zip; do
            test -s "dist/nuc-console-$VERSION-$os"
          done
          test "$(find dist -type f | wc -l)" -eq 7   # the six archives and SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          ls -l dist
          tar tzf "dist/nuc-console-$VERSION-linux-x86_64.tar.gz" > linux-x86_64.list
          head -40 linux-x86_64.list
          unzip -l "dist/nuc-console-$VERSION-windows-x64.zip"

      - name: The Linux x86-64 archive runs on its own Python, unpacked somewhere else
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          tar xzf "dist/nuc-console-$VERSION-linux-x86_64.tar.gz" -C "$d"
          cd "$d/nuc-console-$VERSION"
          test "$(./run.sh --which-python)" = "$PWD/python/bin/python3"   # the Python of the archive, not the runner's
          ./python/bin/python3 -c 'import sys, ssl, sqlite3, json, ctypes, http.server; print(sys.version); print(sys.prefix)'
          timeout 120 ./run.sh --problems > /dev/null

      - name: Keep the archives for the release job (a dry run keeps them for a week, to look at)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write       # create the release and attach the archives
      id-token: write       # sign the provenance with this workflow's OIDC identity
      attestations: write   # and store it with the repository
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: What was built is what is published
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          test "$(find . -type f | wc -l)" -eq 7   # the six archives and SHA256SUMS
          for os in linux-x86_64.tar.gz linux-arm64.tar.gz macos-arm64.tar.gz macos-x86_64.tar.gz windows-x64.zip windows-arm64.zip; do
            test -s "nuc-console-${TAG#v}-$os"
          done

      - name: Provenance of every archive
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --verify-tag --title "nuc-console ${TAG#v}" --generate-notes
