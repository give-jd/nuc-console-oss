name: release

# Push a tag vX.Y.Z (X.Y.Z = VERSION in src/nuc_config.py) and this builds the archives for every OS with
# tools/build_release.py, attests each one (SLSA build provenance, signed with this workflow's identity) and creates the
# GitHub release with the archives and SHA256SUMS.
#
# Dry run: Actions > release > Run workflow, choose the branch or tag to build and type the tag it is for (v1.4.0). The same
# checks and the same archives, uploaded as a workflow artifact: no provenance is signed and no release is created.
#
# Actions are pinned by commit SHA (the comment says which release it is); the only secret is the built-in GITHUB_TOKEN.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag this build is for (vX.Y.Z); it must be VERSION in src/nuc_config.py. Nothing is released."
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write       # create the release and attach the archives
      id-token: write       # sign the provenance with this workflow's OIDC identity
      attestations: write   # and store it with the repository
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The tag is the version of the code
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: '$TAG' is not a tag vX.Y.Z" >&2
            exit 1
          fi
          version="$(python3 -c 'import sys; sys.path.insert(0, "src"); import nuc_config; print(nuc_config.VERSION)')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "error: the tag is $TAG but VERSION in src/nuc_config.py is $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # the interpreter that makes the archives: zlib decides the bytes of the compressed streams
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Download the embeddable Pythons and check their SHA-256
        shell: bash
        run: |
          set -euo pipefail
          # file, SHA-256 and URL of each one: from $PyVersion / $PyBuilds of install-windows.ps1, the pins the installer checks
          python3 tools/build_release.py --list-python > python-zips.txt
          [ "$(wc -l < python-zips.txt)" -eq 2 ]
          mkdir pyzips
          while read -r file sha256 url; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
              --output "pyzips/$file" "$url"
            echo "$sha256  pyzips/$file" | sha256sum --check -
          done < python-zips.txt

      - name: Build the archives
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_release.py --version "$VERSION" --out dist --python-zips pyzips
          # the same input must give the same bytes: build again and compare
          python3 tools/build_release.py --version "$VERSION" --out dist-again --python-zips pyzips > /dev/null
          diff <(ls dist) <(ls dist-again)
          for f in dist/*; do cmp "$f" "dist-again/$(basename "$f")"; done
          rm -r dist-again
          for os in linux.tar.gz macos.tar.gz windows-x64.zip windows-arm64.zip; do
            test -s "dist/nuc-console-$VERSION-$os"
          done
          test "$(find dist -type f | wc -l)" -eq 5   # the four archives and SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          ls -l dist
          tar tzf "dist/nuc-console-$VERSION-linux.tar.gz"
          unzip -l "dist/nuc-console-$VERSION-windows-x64.zip"

      - name: Provenance of every archive
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --verify-tag --title "nuc-console $VERSION" --generate-notes

      - name: Dry run, keep the archives
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuc-console-${{ env.VERSION }}-dry-run
          path: dist/
          if-no-files-found: error
          retention-days: 7
