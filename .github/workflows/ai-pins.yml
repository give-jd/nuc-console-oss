name: ai-pins

# The AI manifest (src/aisetup.py: RUNTIME, MODELS) pins the model server (Ollama: each build's file, SHA-256 and size) and names the models
# to pull. This workflow, on machines with network access: reads the values from the GitHub API, the release's sha256sum.txt and the Ollama
# registry (`aisetup.py pins`: each model's manifest, its size and the first words of its licence) for a maintainer to compare and paste;
# and tries it for real on Linux, Windows and macOS runners: installs the smallest model with `nuc-console-ai setup`, starts `serve`, asks it
# a question and checks `status`, then does what the AI page's button does (aiweb.Engine.use_model: download, unpack, start, pull, load) in a
# folder of its own and asks again. It never changes the repository and never fails a pull request (the unit tests do that).
#
# The job `python-pins` does the same for the Python that the Linux and macOS release archives carry (python-build-standalone,
# the install_only_stripped tarballs of the four targets): it reads the latest release of astral-sh/python-build-standalone, lists
# the files of the newest stable 3.13.x (3.12.x if 3.13 is missing) with their SHA-256 (the release's SHA256SUMS, checked against the
# asset digest) and size, prints them in the log and in the job summary as the JSON for tools/python-pins.json, downloads the four
# tarballs to check that bytes and numbers agree and that tools/build_release.py can read them, and runs the Linux x86-64 one. A
# maintainer pastes the JSON into tools/python-pins.json (CONTRIBUTING.md, Releasing); until then the release workflow stops. Once
# pinned, the same job checks the pinned values against the release that holds them.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/aisetup.py
      - src/aiollama.py
      - src/advisor.py
      - tools/python_pins.py
      - tools/python-pins.json
      - .github/workflows/ai-pins.yml

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}   # only for the API rate limit; aisetup sends it to api.github.com and nowhere else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: read the values to pin (the server's builds, the models' manifests)
        continue-on-error: true
        run: python3 src/aisetup.py pins | tee pins.txt
      - name: summary
        if: always()
        run: |
          { echo '```'; cat pins.txt 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  python-pins:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}   # only for the API rate limit; sent to api.github.com and nowhere else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: the Python to pin (python-build-standalone), its SHA-256 and size; the pins in the repository, checked
        continue-on-error: true
        run: python3 tools/python_pins.py --json "$RUNNER_TEMP/python-pins.json" --download "$RUNNER_TEMP/standalone"   # the table and the JSON also go to the job summary
      - name: the Linux x86-64 Python runs from where it is unpacked
        continue-on-error: true
        run: |
          set -eu
          f=$(ls "$RUNNER_TEMP"/standalone/*x86_64-unknown-linux-gnu-install_only_stripped.tar.gz)
          mkdir "$RUNNER_TEMP/unpacked"
          tar xzf "$f" -C "$RUNNER_TEMP/unpacked"
          ls -l "$RUNNER_TEMP/unpacked/python/bin" | head -40
          find "$RUNNER_TEMP/unpacked/python" -type l | head -20
          "$RUNNER_TEMP/unpacked/python/bin/python3" -c 'import sys, ssl, sqlite3, json, ctypes, http.server; print(sys.version); print(sys.prefix)'
          { echo; echo '```'; "$RUNNER_TEMP/unpacked/python/bin/python3" -V; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  for-real:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: setup, serve, status and a question, as the commands do them
        continue-on-error: true
        shell: bash
        run: |
          set -x
          d="$RUNNER_TEMP/ai"
          printf '[ai]\nenabled = yes\nendpoint = http://127.0.0.1:8091/v1\nmodel = qwen3-0.6b\n' > "$RUNNER_TEMP/config.ini"
          export NUC_CONSOLE_CONFIG="$RUNNER_TEMP/config.ini"
          python src/aisetup.py models --dir "$d"
          python src/aisetup.py setup qwen3-0.6b --yes --no-config --dir "$d"
          python src/aisetup.py setup qwen3-0.6b --yes --no-config --dir "$d" | grep -q "not downloaded again"   # never twice
          python src/aisetup.py serve --model qwen3-0.6b --port 8091 --dir "$d" --dry-run
          python src/aisetup.py serve --model qwen3-0.6b --port 8091 --dir "$d" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:8091/v1/models > /dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8091/v1/models
          curl -fsS --max-time 300 http://127.0.0.1:8091/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"model": "qwen3-0.6b", "messages": [{"role": "user", "content": "Say hello in five words."}], "max_tokens": 40}'
          echo
          # Qwen3 thinks by default: the advisor asks an Ollama not to, and the answer must then be in `content`
          curl -fsS --max-time 300 http://127.0.0.1:8091/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"model": "qwen3-0.6b", "messages": [{"role": "user", "content": "Say hello in five words."}], "max_tokens": 40, "reasoning_effort": "none"}' \
            > "$RUNNER_TEMP/answer.json"
          python -c "import json, sys; c = json.load(open(sys.argv[1]))['choices'][0]['message']; print('content:', repr(c.get('content')), 'reasoning:', repr(c.get('reasoning'))); sys.exit(0 if (c.get('content') or '').strip() else 1)" "$RUNNER_TEMP/answer.json"
          python src/aisetup.py status --dir "$d" --endpoint http://127.0.0.1:8091/v1
          python src/advisor.py status
          tail -40 "$RUNNER_TEMP/serve.log"
          python src/aisetup.py remove qwen3-0.6b --yes --dir "$d"
      - name: the AI page's one button (download, unpack, start, pull, load), then a question through the advisor
        continue-on-error: true
        shell: bash
        run: |
          printf '[ai]\nenabled = no\n' > "$RUNNER_TEMP/config2.ini"
          export NUC_CONSOLE_CONFIG="$RUNNER_TEMP/config2.ini"
          python - "$RUNNER_TEMP/ai2" <<'PY'
          import sys, time
          sys.path.insert(0, "src")
          import advisor, aiweb
          eng = aiweb.Engine(directory=sys.argv[1])
          last = [None]
          def hook(job):
              line = aiweb.job_text(job)
              if line.split(",")[0] != last[0]:
                  last[0] = line.split(",")[0]
                  print(time.strftime("%H:%M:%S"), line, flush=True)
          eng.progress_hook = hook
          print(eng.use_model("qwen3-0.6b"), flush=True)
          eng.wait(1800)
          snap = eng.snapshot()
          print("job:", snap["job"]["state"], snap["job"]["error"] or snap["job"]["note"])
          print("state:", snap["state"])
          print("server's last lines:", " | ".join(snap["server"]["tail"]))
          if snap["job"]["state"] == "done":
              cfg = eng.ecfg()
              t0 = time.time()
              msg = advisor.chat(advisor.endpoint_info(cfg["ai"]["endpoint"]), cfg["ai"]["model"],
                                 [{"role": "user", "content": "/no_think Say hello in five words."}], max_tokens=40, timeout=300)
              answer = advisor._content(msg)
              print("answer (%.1f s): %r" % (time.time() - t0, answer))
              if not answer.strip():
                  snap["job"]["state"] = "empty answer"
          eng.delete_all()
          eng.wait(300)
          print("delete:", eng.snapshot()["job"]["state"], eng.snapshot()["job"]["note"] or eng.snapshot()["job"]["error"])
          eng.shutdown()
          sys.exit(0 if snap["job"]["state"] == "done" else 1)
          PY
