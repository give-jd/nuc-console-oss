# nuc-console configuration. Every key is optional: a missing key, file or broken value means the default shown here.
# What each key does, its values and when a change applies: the web view's settings page, or docs/CONFIGURATION.md.
# Installed to /etc/nuc-console/config.ini (Windows: %ProgramData%\nuc-console\config.ini), never overwritten.
# Apply: Linux  sudo systemctl restart nuc-console nuc-console-collector
#        macOS  sudo ./install.sh again  |  Windows  install-windows.cmd again

[features]
# no = not drawn, no alarms, and its commands are not run by the root collector
containers      = yes
databases       = yes
webapps         = yes
exposure        = yes
firewall        = yes
fail2ban        = yes   # drawn inside FIREWALL: needs firewall = yes
tailscale       = yes
boot            = yes
docker_disk     = yes
network_traffic = yes
sessions        = yes
disks           = yes
thermal         = yes
map             = yes   # screens: MAP (key 2)
cpu             = yes   # CPU (key 3)
health          = yes   # HEALTH (key 4), keeps history.db
ai              = yes   # AI (key 5); the advisor itself is [ai] enabled

[web]
# Optional web view, the only network listener (docs/WEB.md). A bind other than 127.0.0.1 REQUIRES token_file.
enabled = no
bind = 127.0.0.1
port = 8787
token_file =
allowed_hosts =
settings_actions = no   # yes = the settings page of an installation may change presentation keys (needs token_file)
columns = 200
rows = 60

[telegram]
# Alerts on your phone through a bot of your own (docs/TELEGRAM.md). Set up with: sudo nuc-console-telegram --setup
enabled = no
username =
detail = titles         # titles | full
resolved = yes
web_actions = yes

[console]
# Linux text console, applied when nuc-console.service starts. font: for setfont, e.g. Lat15-TerminusBold32x16
font =
blank_minutes = 0       # 0-60; 0 = never

[display]
# macOS and Windows only: how the dashboard shows itself at login.
# mode: browser | fullscreen | none; zoom: percent, 50-200
mode = browser
zoom = 100
browser = auto

[dashboard]
# Overview order, top-left first; names as under [ui] layout. Left out = at the end.
# sections = attention, exposure, webapps, firewall, system, containers, databases, boot,
#            network_traffic, sessions, tailscale, docker_disk, disks
mode = overview         # overview (one screen) | rotate (3 pages)
rotate_seconds = 15
refresh_seconds = 2     # 1-10, every screen
columns = 0             # 0 = the real console size
rows = 0
spacing = 1
details = yes           # Details pages that show what the overview cut
overview_seconds = 45
map_in_rotation = no
cpu_in_rotation = no
health_in_rotation = no

[ui]
# Look and layout; all optional, shown with their defaults (precedence and the card/KPI names: docs/CONFIGURATION.md)
# web = app              # app | classic (classic goes away in a later release)
# theme = auto           # auto | dark | light | high-contrast
# density = desk         # wall | desk | compact
# start_view = overview  # overview | map | cpu | health | ai
# preset = default       # default | security | server | desktop
# order = severity       # severity | fixed
# kpis = problems, internet, lan, beyond, cpu, ram, disk, temp
# layout = attention:2, exposure:2, webapps, firewall, system, containers:2
# hidden = sessions, docker_disk

[webapps]
# Web apps you EXPECT to be reachable: name = port[, port...]. A port listed here is an intended exposure.
# ethibid = 8180, 8543

[expose]
# The widest reach you intend for a service: local | tailnet | lan | internet.
# Wider in reality: ATTENTION "over-exposed".
# Never start a key with ":".
# shop-db = local
# n8n     = tailnet
# 8080    = lan

[ai]
# Optional local model for the HEALTH advice (docs/AI.md); talks to an OpenAI-compatible server on this machine.
enabled = no
endpoint = http://127.0.0.1:11434/v1
model =
gpu = auto              # auto | no
allow_remote = no       # an endpoint on another machine receives your history
timeout_s = 120
web_actions = yes       # no = the AI page only shows
daily = no
