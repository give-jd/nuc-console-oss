# nuc-console configuration. Installed to /etc/nuc-console/config.ini (never overwritten by install.sh).
# Every key is optional: a missing key, a missing file or a broken value means "on" / the default shown here.
# Apply changes with:  sudo systemctl restart nuc-console nuc-console-collector

[features]
# A disabled section is not drawn, does not raise alarms, and (for the ones below marked "collector")
# its commands are never run by the root collector: turning a feature off also reduces what runs as root.
containers      = yes   # Docker containers list and health (collector: docker)
databases       = yes   # DB/broker ports and who connects from outside (collector: docker, ss, nsenter)
webapps         = yes   # WEB APPS section: declared apps (up/down) and web listeners found (renderer only)
exposure        = yes   # listening ports by scope: local / LAN / Tailscale / Internet, Funnel, port alarms; also the "databases open in LAN" alarm (collector: ss, tailscale serve)
firewall        = yes   # ufw, iptables, DOCKER-USER, recent drops (collector: ufw, iptables, journalctl)
fail2ban        = yes   # fail2ban jails and bans (collector: fail2ban-client); drawn inside the FIREWALL section, so it needs firewall = yes to be visible
tailscale       = yes   # tailnet peers list (collector: tailscale). Funnel/serve exposure follows `exposure`, not this
boot            = yes   # boot time, slowest units, failed units, journal errors (collector: systemd-analyze, journalctl)
docker_disk     = yes   # docker disk usage (collector: docker system df)
network_traffic = yes   # per-interface throughput sparklines (reads /proc, renderer only)
sessions        = yes   # logged-in users and ssh sessions (renderer only)
disks           = yes   # mounted filesystems usage (renderer only)
thermal         = yes   # CPU/NVMe temperature and throttling (renderer only)

[web]
# Optional READ-ONLY web view of the same screen (see docs/WEB.md). Off by default: it is the only network listener of the project.
enabled = no
# Default = loopback: publish it with `tailscale serve` (tailnet authentication) or a reverse proxy.
# Any other address REQUIRES token_file, otherwise the service refuses to start.
bind = 127.0.0.1
port = 8787
# File with a secret (16+ chars), readable by the nuc-console user, mode 0600. Never put the token in this file (it is world-readable).
token_file =
# Extra Host header names accepted when NO token is set (DNS-rebinding guard). localhost, 127.0.0.1, the bind address, the hostname
# and *.ts.net are always accepted. Comma-separated, e.g. nuc.example.lan
allowed_hosts =
columns = 200           # default layout width (60-300); a page can ask ?cols=100
rows = 60
refresh_seconds = 5

[dashboard]
# Fixed on-screen order of the overview sections, top-left to bottom-right, filling one column before the next.
# Default = by priority: what needs action, security posture, resources, workloads, history, then detail panels.
# Names: attention, exposure, webapps, firewall, system, containers, databases, boot, network_traffic, sessions, tailscale, docker_disk, disks
# Sections you leave out keep their default place at the end; a disabled feature ([features]) is simply not drawn.
# sections = attention, exposure, webapps, firewall, system, containers, databases, boot, network_traffic, sessions, tailscale, docker_disk, disks
# overview = one screen, no keyboard needed (default); rotate = 3 pages that rotate, keys 1-3 jump to a page
mode = overview
# seconds per page in rotate mode (3-600)
rotate_seconds = 15
# Layout size in characters; 0 = use the real console size. Use it when elements run off the screen (real console
# wider/taller than what the monitor shows): the layout is never larger than the real console.
columns = 0
rows = 0
# 1 = a blank line under each section title (more air, needs a few more rows); 0 = compact
spacing = 1
# The overview cuts long lists ("… +N more"). With details = yes the monitor rotates to "Details" pages that show those sections
# in full (the monitor has no keyboard), then comes back. overview_seconds = how long the overview stays before the detail pages
# (10-600); each detail page stays rotate_seconds. details = no: never rotate, the overview alone.
details = yes
overview_seconds = 45

[webapps]
# Web apps you EXPECT to be reachable: name = port[, port...]. Shown in WEB APPS as active, or as DOWN when nothing listens.
# A port listed here is an intended exposure: it no longer counts as a "Docker port bypassing ufw" problem.
# ethibid = 8180, 8543
