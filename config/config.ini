# nuc-console configuration. Installed to /etc/nuc-console/config.ini (never overwritten by install.sh).
# Every key is optional: a missing key, a missing file or a broken value means "on" / the default shown here.
# Apply changes with:  sudo systemctl restart nuc-console nuc-console-collector

[features]
# A disabled section is not drawn, does not raise alarms, and (for the ones below marked "collector")
# its commands are never run by the root collector: turning a feature off also reduces what runs as root.
containers      = yes   # Docker containers list and health (collector: docker)
databases       = yes   # DB/broker ports and who connects from outside (collector: docker, ss, nsenter)
exposure        = yes   # listening ports by scope: local / LAN / Tailscale / Internet, Funnel, port alarms; also the "databases open in LAN" alarm (collector: ss, tailscale serve)
firewall        = yes   # ufw, iptables, DOCKER-USER, recent drops (collector: ufw, iptables, journalctl)
fail2ban        = yes   # fail2ban jails and bans (collector: fail2ban-client); drawn inside the FIREWALL section, so it needs firewall = yes to be visible
tailscale       = yes   # tailnet peers list (collector: tailscale). Funnel/serve exposure follows `exposure`, not this
boot            = yes   # boot time, slowest units, failed units, journal errors (collector: systemd-analyze, journalctl)
docker_disk     = yes   # docker disk usage (collector: docker system df)
network_traffic = yes   # per-interface throughput sparklines (reads /proc, renderer only)
sessions        = yes   # logged-in users and ssh sessions (renderer only)
disks           = yes   # mounted filesystems usage (renderer only)
thermal         = yes   # CPU/NVMe temperature and throttling (renderer only)

[dashboard]
# overview = one screen, no keyboard needed (default); rotate = 3 pages that rotate, keys 1-3 jump to a page
mode = overview
# seconds per page in rotate mode (3-600)
rotate_seconds = 15
# Layout size in characters; 0 = use the real console size. Use it when elements run off the screen (real console
# wider/taller than what the monitor shows): the layout is never larger than the real console.
columns = 0
rows = 0
